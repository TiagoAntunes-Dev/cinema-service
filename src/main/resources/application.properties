# ============================================================================================
# FICHEIRO: application.properties (Configuracoes Globais do Spring Boot)
# ============================================================================================

# Define o nome oficial da aplicacao dentro do ecossistema do Spring.
spring.application.name=cinema-service

# URL publica do Render
springdoc.server.url=https://cinema-service-sv1b.onrender.com

# Suporte aos cabecalhos de encaminhamento do proxy do Render
server.forward-headers-strategy=framework

# ============================================================================================
# BANCO DE DADOS: CONEXAO MYSQL (DOCKER CONTAINER TO DOCKER CONTAINER)
# ============================================================================================
# URL de conexao com a base de dados MySQL no host (usando host.docker.internal para container da API)
spring.datasource.url=jdbc:mysql://mysqldb:3306/cinema_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=tiago
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================================================
# HIBERNATE / JPA CONFIGURACOES
# ============================================================================================
# O 'update' valida o esquema e atualiza a estrutura mantendo os dados intactos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Desativa a execucao automatica de scripts data.sql para nao sobrescrever os dados inseridos
spring.sql.init.mode=never

# ============================================================================================
# RATE LIMIT (Token Bucket) - vale a partir da versao 2 da API
# ============================================================================================
rate-limit.capacity=100
rate-limit.refill-tokens=100
rate-limit.refill-seconds=60

# ============================================================================================
# CORS - origens (front-ends) autorizadas a chamar a API pelo navegador
# ============================================================================================
# CORS liberado para o proprio dominio do Render e ambiente local
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200,https://cinema-service-sv1b.onrender.com

# ============================================================================================
# API KEY - chaves aceitas no cabecalho X-API-Key
# ============================================================================================
api-key.valid-keys=cinelog-demo-key-123,cinelog-front-key-456

# ============================================================================================
# SWAGGER UI CONFIGURACOES
# ============================================================================================
springdoc.swagger-ui.tags-sorter=alpha
springdoc.writer-with-order-by-keys=true